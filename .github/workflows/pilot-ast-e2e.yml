name: Integrated AST production-asset E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cross-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium, Firefox and WebKit with Linux dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Compare integrated production and frozen Babel reference in all three engines
        run: pnpm pilot:production-e2e
      - name: Compare all emitted JavaScript sizes and assert independent module graphs
        shell: bash
        run: |
          set -o pipefail
          pnpm pilot:build | tee bundle-comparison.txt
          {
            echo '## Integrated AST vs frozen Babel reference'
            echo 'All emitted JS, including the Worker. This is a local source build comparison, not a release claim.'
            echo '```text'
            cat bundle-comparison.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
