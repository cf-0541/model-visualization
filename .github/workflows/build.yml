name: Test, build and attach release artifact

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach (for example v0.1.2)
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Verify release tag matches package version
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build production bundle
        run: pnpm build
      - name: Report bundle sizes
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, readdirSync } from 'node:fs';
          import { join, relative } from 'node:path';
          import { gzipSync } from 'node:zlib';

          const files = [];
          function collect(directory) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) collect(path);
              else if (entry.isFile()) files.push(path);
            }
          }
          collect('dist');
          files.sort((a, b) => a.localeCompare(b, 'en'));

          const format = bytes => `${(bytes / 1000).toFixed(2)} kB (${bytes} B)`;
          const lines = [
            '## Production bundle sizes',
            '',
            '| File | Raw | Gzip |',
            '| --- | ---: | ---: |',
          ];
          let totalRaw = 0;
          let totalGzip = 0;
          for (const file of files) {
            const contents = readFileSync(file);
            const raw = contents.length;
            const gzip = gzipSync(contents).length;
            totalRaw += raw;
            totalGzip += gzip;
            const name = relative('dist', file).replaceAll(String.fromCharCode(92), '/').replaceAll('|', '&#124;');
            lines.push(`| ${name} | ${format(raw)} | ${format(gzip)} |`);
          }
          lines.push(`| **Total (${files.length} files)** | **${format(totalRaw)}** | **${format(totalGzip)}** |`, '');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
      - name: Save dist as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          overwrite: true

  attach-release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Attach dist archive to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName > /dev/null
          zip -qr "algorithm-motion-lab-${RELEASE_TAG}-dist.zip" dist
          gh release upload "$RELEASE_TAG" "algorithm-motion-lab-${RELEASE_TAG}-dist.zip" --clobber
