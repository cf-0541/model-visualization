# Install as /etc/nginx/sites-available/default AFTER preparing current.
# HTTP bootstrap only. Domain/ICP/HTTPS setup is a separate step.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/algorithm-motion-lab/current;
    index index.html;
    autoindex off;

    location /assets/ {
        alias /var/www/algorithm-motion-lab/shared-assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Do NOT open port 8080 in the cloud firewall. It binds only to loopback.
# Keep this listener when configuring HTTPS on the public server block.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /var/www/algorithm-motion-lab/current;
    location /assets/ {
        alias /var/www/algorithm-motion-lab/shared-assets/;
    }
    location / {
        try_files $uri =404;
    }
}
